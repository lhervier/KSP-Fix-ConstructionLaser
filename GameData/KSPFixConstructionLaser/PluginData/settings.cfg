// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// Makes the game recognise a kerbal's trait in every language. On stock, in a game that is not in English, an
// engineer is not recognised as one: the parts it attaches in EVA construction mode are not welded (no turn to the
// part, no visor, no laser), and KSP.log reads "Kerbal is not an engineer!" at each one.
traitsComparedByName = True

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line per stock method patched,
// when KSP starts.
logLevel = Info
